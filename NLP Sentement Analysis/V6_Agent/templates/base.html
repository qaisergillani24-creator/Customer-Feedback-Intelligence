<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Customer Feedback Intelligence{% endblock %}</title>
  <script>
    try { if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-bs-theme", "dark"); } catch (e) {}
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="container" style="max-width: 1180px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div class="d-flex align-items-center gap-3">
        <div class="brand-icon"><i class="bi bi-graph-up-arrow"></i></div>
        <div>
          <div class="brand-title">Customer Feedback Intelligence</div>
          <div class="brand-sub">Sentiment, complaints and AI insights from your reviews</div>
        </div>
      </div>
      <nav class="d-flex align-items-center gap-2">
        <a href="/" class="top-link {{ 'active' if request.path == '/' else '' }}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
        <a href="/analyst" class="top-link {{ 'active' if request.path == '/analyst' else '' }}"><i class="bi bi-robot me-1"></i>AI Analyst</a>
        <button id="theme-toggle" class="theme-btn" type="button" title="Light or dark mode"><i id="theme-icon" class="bi bi-moon-stars-fill"></i></button>
      </nav>
    </div>
  </div>
</header>

{% block content %}{% endblock %}

<div id="overlay" class="loading-overlay">
  <div class="spinner-border" style="width: 3rem; height: 3rem;" role="status"></div>
  <div id="overlay-text" class="mt-3 fw-semibold"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function () {
    var overlay = document.getElementById("overlay");
    var overlayText = document.getElementById("overlay-text");
    document.querySelectorAll("form[data-loading]").forEach(function (f) {
      f.addEventListener("submit", function () {
        overlayText.textContent = f.getAttribute("data-loading");
        overlay.classList.add("show");
      });
    });
    window.addEventListener("pageshow", function () { overlay.classList.remove("show"); });

    var btn = document.getElementById("theme-toggle");
    var icon = document.getElementById("theme-icon");
    function isDark() { return document.documentElement.getAttribute("data-bs-theme") === "dark"; }
    function syncIcon() { if (icon) icon.className = "bi " + (isDark() ? "bi-sun-fill" : "bi-moon-stars-fill"); }
    if (btn) {
      btn.addEventListener("click", function () {
        var next = isDark() ? "light" : "dark";
        document.documentElement.setAttribute("data-bs-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        syncIcon();
      });
    }
    syncIcon();
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
